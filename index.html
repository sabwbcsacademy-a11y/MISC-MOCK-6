    .correct-opt { background: #dcfce7; padding: 6px; border-radius: 4px; }

    th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }

    let timerInterval;
    let timeRemaining = 90 * 60; // 90 Minutes in seconds
    let userData = { name: "", phone: "" };

    // --- 4. VERIFICATION & ATTEMPT TRACKING ---
    async function verifyAndStart() {
      const name = document.getElementById("student-name").value.trim();
      const phone = document.getElementById("student-phone").value.trim();
      const err = document.getElementById("login-err");

      if (!name || !phone) {
        err.innerText = "Please fill in both Name and Mobile Number.";
        return;
      }

      if (!ALLOWED_NUMBERS.includes(phone)) {
        err.innerText = "Access Denied: Mobile number not eligible or registered.";
        return;
      }

      // Read current attempts from Firebase Database
      const userRef = db.ref('users/' + phone);
      const snapshot = await userRef.once('value');
      const attempts = snapshot.val() ? snapshot.val().attempts : 0;

      if (attempts >= 20) {
        err.innerText = "Attempt Limit Reached: You have already used all 20 allowed test attempts.";
        return;
      }

      // Save updated attempt count to Firebase
      await userRef.set({ attempts: attempts + 1, studentName: name });

      userData = { name, phone };
      document.getElementById("disp-name").innerText = name;

      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("exam-section").classList.remove("hidden");

      renderQuestions();
      startTimer();
    }

    // --- 5. RENDER EXAM QUESTION CARDS ---
    function renderQuestions() {
      const form = document.getElementById("quiz-form");
      form.innerHTML = questions.map((q, i) => `
        <div class="q-card" id="q-card-${i}">
          <div class="q-title">${i + 1}. ${q.q}</div>
          <div class="options">
            ${q.options.map((opt, optIdx) => `
              <label>
                <input type="radio" name="q${i}" value="${optIdx}">
                ${opt}
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // --- 6. TIMER ENGINE ---
    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        let mins = Math.floor(timeRemaining / 60);
        let secs = timeRemaining % 60;
        document.getElementById("time-disp").innerText = 
          `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert("Time limit reached! Submitting your mock test now.");
          submitTest();
        }
      }, 1000);
    }

    // --- 7. EVALUATION & SUBMISSION ---
    function submitTest() {
      clearInterval(timerInterval);

      let correct = 0;
      let wrong = 0;
      let unattempted = 0;
      const userAnswers = [];

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected) {
          const val = parseInt(selected.value);
          userAnswers.push(val);
          if (val === q.answer) {
            correct++;
          } else {
            wrong++;
          }
        } else {
          userAnswers.push(null);
          unattempted++;
        }
      });

      // Score Calculation: +2 per correct, -0.5 per wrong
      const finalScore = (correct * 2) - (wrong * 0.5);

      document.getElementById("score-summary").innerHTML = `
        <p><strong>Candidate Name:</strong> ${userData.name}</p>
        <p><strong>Phone:</strong> ${userData.phone}</p>
        <p><strong>Final Score:</strong> ${finalScore} / 200</p>
        <p><strong>Correct (+2 each):</strong> ${correct}</p>
        <p><strong>Wrong (-0.5 each):</strong> ${wrong}</p>
        <p><strong>Unattempted:</strong> ${unattempted}</p>
      `;

      // Save user result to Google Sheets
      saveToGoogleSheet({
        name: userData.name,
        phone: userData.phone,
        score: finalScore,
        correct: correct,
        wrong: wrong,
        unattempted: unattempted
      });

      renderReview(userAnswers);
      renderAnswerTable();

      document.getElementById("exam-section").classList.add("hidden");
      document.getElementById("result-section").classList.remove("hidden");
    }

    // --- 8. SAVE TO GOOGLE SHEETS VIA APPS SCRIPT ---
    function saveToGoogleSheet(data) {
      fetch(GOOGLE_SHEET_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).catch(err => console.error("Error submitting result to Google Sheet:", err));
    }

    // --- 9. RENDER PREVIEW & MASTER ANSWER KEY TABLE ---
    function renderReview(userAnswers) {
      const container = document.getElementById("review-questions");
      container.innerHTML = questions.map((q, i) => {
        const userAns = userAnswers[i];
        return `
          <div class="q-card">
            <div class="q-title">${i + 1}. ${q.q}</div>
            <div class="options">
              ${q.options.map((opt, optIdx) => {
                let cls = "";
                if (optIdx === q.answer) cls = "correct-opt";
                else if (userAns === optIdx && userAns !== q.answer) cls = "wrong-opt";
                
                return `
                  <div class="${cls}">
                    ${optIdx === userAns ? "<strong>[Your Choice]</strong> " : ""}
                    ${optIdx === q.answer ? "<strong>[Correct Answer]</strong> " : ""}
                    ${opt}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAnswerTable() {
      const tbody = document.getElementById("ans-table-body");
      tbody.innerHTML = questions.map((q, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${q.options[q.answer]}</td>
        </tr>
      `).join('');
    }
  </script>
